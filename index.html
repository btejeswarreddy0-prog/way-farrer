<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Wayfarer — Find your way</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5f4ef;--white:#fffefa;--ink:#18231d;--muted:#747a72;--green:#183d31;--green2:#254d3e;--line:#e3e4dc;--lime:#c7d7a4;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh}button,a{font:inherit}.page{min-height:100vh;display:flex;flex-direction:column}.topbar{height:82px;padding:0 clamp(22px,6.8vw,104px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(24,35,29,.08)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:-.7px}.brand-mark{width:30px;height:30px;background:var(--green);border-radius:50%;display:grid;place-items:center;color:#f5f4ef}.brand-mark svg{width:18px}.top-link{color:#626a62;text-decoration:none;font-size:13px;font-weight:600}.top-link:hover{color:var(--green)}main{width:min(1120px,calc(100% - 44px));margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:64px 0 75px}.intro{text-align:center;margin:0 auto 38px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--green2);text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700}.eyebrow:before,.eyebrow:after{content:'';width:20px;height:1px;background:#9aa995}.intro h1{font-family:var(--serif);font-size:clamp(39px,5vw,59px);font-weight:500;letter-spacing:-2px;line-height:1.08;margin:17px 0 12px}.intro h1 em{font-weight:500;color:#597562}.intro p{font-size:15px;color:var(--muted);line-height:1.7;margin:0}.roles{display:grid;grid-template-columns:1fr 1fr;gap:19px;max-width:900px;width:100%;margin:0 auto}.role{--accent:#315d49;--deep:#1d4636;--wash:#eaf1e9;--edge:#d4e0d3;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,var(--wash),#fffefa 78%);border:1px solid var(--edge);border-radius:15px;text-align:left;cursor:pointer;padding:0;min-height:220px;color:var(--ink);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;box-shadow:0 6px 22px rgba(25,37,29,.045)}.role[data-role="lister"]{--accent:#8a6248;--deep:#65452f;--wash:#f2e9de;--edge:#e7d8c8}.role:before{content:"";position:absolute;z-index:-1;width:210px;height:210px;right:-75px;top:-100px;border-radius:50%;background:var(--accent);opacity:.09;transition:transform .4s ease,opacity .3s ease}.role:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 17px 36px rgba(25,37,29,.13)}.role:hover:before{transform:scale(1.28);opacity:.15}.role:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.role[aria-pressed="true"]{color:#fff;background:linear-gradient(135deg,var(--deep),var(--accent));border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),0 16px 34px rgba(25,37,29,.16)}.role[aria-pressed="true"]:before{opacity:.2;transform:scale(1.2)}.role-content{padding:30px 28px 32px;min-height:220px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}.role-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.role h2{font-family:var(--serif);font-size:31px;letter-spacing:-.7px;font-weight:600;margin:0}.arrow{width:33px;height:33px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--green);transition:all .2s}.role:hover .arrow{background:var(--accent);color:white;border-color:var(--accent)}.role[aria-pressed="true"] .arrow{background:rgba(255,255,255,.12);color:white;border-color:rgba(255,255,255,.48)}.role p{font-size:14px;color:#737a72;line-height:1.7;margin:10px 40px 0 0;max-width:340px;transition:color .25s ease}.role[aria-pressed="true"] p{color:rgba(255,255,255,.82)}.check{position:absolute;top:18px;right:18px;width:23px;height:23px;background:var(--green);color:white;border:2px solid white;border-radius:50%;display:none;place-items:center;z-index:2}.role[aria-pressed="true"] .check{display:grid}.divider-note{display:flex;align-items:center;justify-content:center;gap:12px;margin:27px auto 17px;color:#858a82;font-size:11px}.divider-note:before,.divider-note:after{content:'';height:1px;width:47px;background:#dedfd8}.continue{display:flex;align-items:center;justify-content:center;gap:10px;min-width:222px;margin:0 auto;background:var(--green);border:0;border-radius:5px;padding:15px 23px;color:white;font-size:13px;font-weight:700;letter-spacing:.2px;cursor:pointer;transition:background .2s,transform .2s,opacity .2s}.continue:hover:not(:disabled){background:#244f3e;transform:translateY(-1px)}.continue:disabled{opacity:.38;cursor:not-allowed}.continue svg{width:16px}.helper{height:18px;text-align:center;font-size:11px;color:#888d85;margin:11px 0 0}.foot{border-top:1px solid rgba(24,35,29,.08);padding:19px clamp(22px,6.8vw,104px);display:flex;justify-content:space-between;align-items:center;color:#858a82;font-size:10px}.foot strong{color:#606b62;font-weight:600}.foot-links{display:flex;gap:22px}.foot a{color:inherit;text-decoration:none}.foot a:hover{color:var(--green)}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#172a21;color:white;padding:12px 18px;border-radius:7px;font-size:13px;box-shadow:0 8px 24px #0002;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:650px){.topbar{height:68px}.top-link{font-size:12px}main{padding:47px 0 52px}.intro{margin-bottom:25px}.intro h1{font-size:42px}.intro p{font-size:13px}.roles{grid-template-columns:1fr;gap:13px}.role{min-height:190px;display:block}.role-content{padding:26px 22px;min-height:190px}.role h2{font-size:26px}.role p{font-size:13px;margin-right:0}.arrow{width:29px;height:29px;flex:none}.check{top:11px;right:12px;left:auto}.divider-note{margin:20px auto 13px}.foot{padding:15px 20px;font-size:9px}.foot-links{gap:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important;animation:none!important;will-change:auto!important}}
    @keyframes landing-rise { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
    @keyframes landing-orbit { 0%,100% { transform:translate(0,0) rotate(0deg); } 50% { transform:translate(-7px,10px) rotate(3deg); } }
    body { background-image:radial-gradient(ellipse at 14% 24%,rgba(228,235,223,.55),transparent 34%),radial-gradient(ellipse at 88% 70%,rgba(239,229,214,.45),transparent 30%); background-attachment:fixed; }
    .topbar { backdrop-filter:blur(14px); background:rgba(245,244,239,.74); animation:landing-rise .65s cubic-bezier(.2,.75,.25,1) both; }
    .brand-mark { transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease; }
    .brand:hover .brand-mark { transform:rotate(-9deg) scale(1.08); box-shadow:0 6px 16px rgba(24,61,49,.2); }
    main { position:relative; }
    .intro { animation:landing-rise .8s .08s cubic-bezier(.2,.75,.25,1) both; }
    .intro h1 { text-wrap:balance; }
    .intro h1 em { display:inline-block; position:relative; }
    .intro h1 em:after { content:""; position:absolute; right:0; bottom:-5px; left:0; height:2px; border-radius:2px; background:linear-gradient(90deg,transparent,#aebd9b,transparent); transform:scaleX(.62); transform-origin:center; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
    .intro:hover h1 em:after { transform:scaleX(1); }
    .role { min-height:250px; border-radius:19px; box-shadow:0 12px 32px rgba(25,37,29,.055); animation:landing-rise .75s cubic-bezier(.2,.75,.25,1) both; }
    .role:nth-child(2) { animation-delay:.14s; }
    .role:before { width:280px; height:280px; right:-116px; top:-150px; }
    .role:after { content:""; position:absolute; z-index:-1; right:-44px; bottom:-92px; width:190px; height:190px; border:1px solid color-mix(in srgb,var(--accent) 19%,transparent); border-radius:50%; box-shadow:0 0 0 22px color-mix(in srgb,var(--accent) 4%,transparent),0 0 0 45px color-mix(in srgb,var(--accent) 3%,transparent); transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s ease; opacity:.7; }
    .role:hover { transform:translateY(-8px); box-shadow:0 24px 55px rgba(25,37,29,.14); }
    .role:hover:after { transform:translate(-9px,-9px) scale(1.06); opacity:1; }
    .role-content { min-height:250px; padding:34px 34px 36px; }
    .role h2 { font-size:35px; transition:letter-spacing .3s ease,transform .3s ease; }
    .role:hover h2 { letter-spacing:.1px; transform:translateX(2px); }
    .role p { max-width:370px; line-height:1.8; }
    .arrow { transition:transform .3s cubic-bezier(.2,.8,.2,1),background .25s,color .25s,border-color .25s; }
    .role:hover .arrow { transform:rotate(45deg); }
    .continue { position:relative; overflow:hidden; min-height:51px; border-radius:8px; box-shadow:0 9px 22px rgba(24,61,49,.16); transition:background .25s,transform .25s,box-shadow .25s,opacity .2s; }
    .continue:hover:not(:disabled) { transform:translateY(-3px); box-shadow:0 14px 28px rgba(24,61,49,.22); }
    .continue:not(:disabled):after { content:""; position:absolute; inset:-60% auto -60% -35%; width:24%; transform:translateX(-190%) rotate(18deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent); transition:transform .65s ease; }
    .continue:hover:not(:disabled):after { transform:translateX(700%) rotate(18deg); }
    .foot { background:rgba(255,254,250,.27); backdrop-filter:blur(8px); }
    @media(max-width:650px) { .role,.role-content { min-height:190px; } .role-content { padding:27px 23px; } .role h2 { font-size:29px; } }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Wayfarer home"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 17.5 10.2 6l3.4 7.2L16 8l3 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.4"/></svg></span>wayfarer</a>
      <a class="top-link" href="mailto:support.wayfarrer@gmail.com">Need a hand? <span style="color:var(--green)">Get in touch ↗</span></a>
    </header>
    <main>
      <section class="intro" aria-labelledby="title">
        <span class="eyebrow">A better way to get there</span>
        <h1 id="title">Every journey<br>starts <em>somewhere.</em></h1>
        <p>Tell us how you’d like to be part of the journey.</p>
      </section>
      <section class="roles" aria-label="Choose how to use Wayfarer">
        <button class="role" type="button" data-role="renter" aria-pressed="false">
          <span class="check" aria-hidden="true">✓</span>
          <span class="role-content"><span class="role-heading"><h2>Renter</h2><span class="arrow" aria-hidden="true">↗</span></span><p>Ask any vehicles for rent, drive your favourite vehicle by renting, and have a great time.</p></span>
        </button>
        <button class="role" type="button" data-role="lister" aria-pressed="false">
          <span class="check" aria-hidden="true">✓</span>
          <span class="role-content"><span class="role-heading"><h2>Lister</h2><span class="arrow" aria-hidden="true">↗</span></span><p>Be a lister and earn money by renting your vehicle to others.</p></span>
        </button>
      </section>
    </main>
    <footer class="foot"><span>© 2026 <strong>Wayfarer</strong>. Made for the road ahead.</span><span class="foot-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></span></footer>
  </div>
  <script>
    const cards = [...document.querySelectorAll('.role')];
    cards.forEach(card => card.addEventListener('click', () => {
      const role = card.dataset.role;
      window.location.href = 'login.html?role=' + encodeURIComponent(role);
    }));
  </script>
</body>
</html>

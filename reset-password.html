<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>Reset password — Wayfarer</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--paper:#f5f4ef;--white:#fffefa;--ink:#18231d;--muted:#747a72;--green:#183d31;--line:#e3e4dc;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:var(--green);font-weight:600;text-decoration:none}.topbar{height:78px;padding:0 clamp(22px,6.8vw,104px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(24,35,29,.08)}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);font:700 23px var(--serif);letter-spacing:-.7px}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:var(--paper)}main{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:48px 20px}.panel{width:min(100%,510px);padding:clamp(28px,6vw,52px);border:1px solid #e6e5dc;border-radius:16px;background:var(--white);box-shadow:0 18px 55px #1c2b210b}.eyebrow{color:var(--green);font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}.panel h1{margin:19px 0 8px;font:500 clamp(34px,7vw,45px)/1.12 var(--serif);letter-spacing:-1px}.subhead{margin:0 0 26px;color:var(--muted);font-size:13px;line-height:1.6}.field{margin-bottom:17px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}.field input{width:100%;height:48px;padding:0 13px;border:1px solid #dcded5;border-radius:7px;background:var(--white);color:var(--ink);font:14px var(--sans)}.field input:focus{outline:0;border-color:#64816d;box-shadow:0 0 0 3px #315d491f}.submit{width:100%;height:49px;border:0;border-radius:7px;background:var(--green);color:white;font:700 13px var(--sans);cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.status{min-height:20px;margin:12px 0 0;color:#68736b;font-size:12px;line-height:1.5}.status.error{color:#a43f34}.status.success{color:var(--green)}.footer{padding:18px 20px;border-top:1px solid rgba(24,35,29,.08);color:#858a82;font-size:10px;text-align:center}@media(max-width:520px){.topbar{height:68px}.topbar .brand{font-size:21px}.panel{padding:27px 22px;border-radius:13px}}
@keyframes auth-reveal { from { opacity:0; transform:translateY(20px) scale(.99); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes auth-glow { 0%,100% { transform:translate3d(0,0,0); opacity:.45; } 50% { transform:translate3d(10px,-12px,0); opacity:.8; } }
body { position:relative; isolation:isolate; overflow-x:hidden; background-image:radial-gradient(ellipse at 10% 14%,rgba(227,235,223,.65),transparent 31%),radial-gradient(ellipse at 94% 84%,rgba(239,229,214,.55),transparent 29%); }
body:before { content:""; position:fixed; z-index:-1; top:12vh; right:8vw; width:230px; height:230px; border:1px solid rgba(49,93,73,.08); border-radius:50%; box-shadow:0 0 0 28px rgba(49,93,73,.025),0 0 0 58px rgba(49,93,73,.018); animation:auth-glow 9s ease-in-out infinite; pointer-events:none; }
.topbar { position:relative; z-index:1; backdrop-filter:blur(12px); background:rgba(245,244,239,.72); }
.panel { position:relative; overflow:hidden; animation:auth-reveal .72s cubic-bezier(.2,.75,.25,1) both; box-shadow:0 24px 65px rgba(28,43,33,.08); transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease; }
.panel:before { content:""; position:absolute; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg,#183d31,#b7c99c 54%,#b28a56); transform:scaleX(.35); transform-origin:left; transition:transform .55s cubic-bezier(.2,.8,.2,1); }
.panel:focus-within:before { transform:scaleX(1); }
.panel h1 { text-wrap:balance; }
.role-chip { transition:transform .25s ease,box-shadow .25s ease; }
.panel:hover .role-chip { transform:translateY(-1px); box-shadow:0 5px 12px rgba(24,61,49,.06); }
.field { animation:auth-reveal .55s cubic-bezier(.2,.75,.25,1) both; }
.field:nth-of-type(2) { animation-delay:.05s; }.field:nth-of-type(3) { animation-delay:.1s; }.field:nth-of-type(4) { animation-delay:.15s; }
.field input { transition:border-color .2s,box-shadow .2s,background .2s,transform .2s; }
.field input:focus { transform:translateY(-1px); background:#fff; }
.submit { position:relative; overflow:hidden; box-shadow:0 8px 18px rgba(24,61,49,.13); }
.submit:hover { transform:translateY(-2px); box-shadow:0 13px 25px rgba(24,61,49,.2); }
.submit svg { transition:transform .25s ease; }.submit:hover svg { transform:translateX(3px); }
.footer { background:rgba(255,254,250,.24); backdrop-filter:blur(8px); }
@media(prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">W</span>wayfarer</a><a href="login.html">Back to sign in</a></header>
<main><section class="panel"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Choose a new password.</h1><p class="subhead">Use at least 8 characters. Your reset link must be valid and unused.</p><p class="status" id="status" aria-live="polite">Checking your password reset link…</p><form id="reset-form" hidden><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></div><button class="submit" type="submit">Update password</button></form></section></main><footer class="footer">© 2026 Wayfarer · <a href="mailto:support.wayfarrer@gmail.com">Contact support</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="reset-password.js?v=20261029-reset"></script></body></html>
